<!-- Main Page for fess up-->
<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Styles -->
        <link rel="stylesheet" href="/stylesheets/mainStyles.css">
        <link rel="stylesheet" href="/stylesheets/postStyles.css">

        <!-- Scripts -->
        <script src="/scripts/darkmode.js" defer></script>
        <script src="/scripts/posts.js" onload="loadPosts()" defer></script>

        <title>FessUp</title>
    </head>

    <body>
        <span id="navbar"></span>
        <script src="/scripts/include.js" onload="includeHTML('/pages/navbar.html', 'navbar')"></script>
        
        <h1>FessUp</h1>
        
        <!-- Cards for Fess Up -->
        <div class="cards" id="cardContainer">
        </div>

        <div id="commentModal" class="modal">
            <div class="modal-content">
                <!-- Close button -->
                <span class="close">&times;</span>

                <!-- Comments list -->
                <h2>Comments</h2>
                <span id="comments"></span>

                <!-- commetns div for appending-->
                <div commentDiv>
                    <!-- div -->
                </div>

                <!-- create comment post -->
                <label for = "commentPoster" style = "text-align: center">Create Comment:</label>
                <input  type = "text" id ="commentPoster" name = "comments" style = "text-align: center" required>
                <button type = "submit" id = "commentSubmitButton">Post Comment</button>
            </div>
        </div>

        <div id="extraInfoModal" class="modal">
            <div class="modal-content">
                <!-- Close button -->
                <span class="close">&times;</span>

                <!-- Buy extra info -->
                <form id="extraInfoForm">
                    <div class="form-group">
                        <label for="cardNumber">Card Number:<br></label>
                        <input type="text" id="cardNumber" name="cardNumber" required>
                    </div>

                    <div class="form-group">
                        <label for="expireMonth">Expiry Month:<br></label>
                        <input type="text" id="expireMonth" name="expireMonth" required>
                    </div>

                    <div class="form-group">
                        <label for="expireYear">Expiry Year:<br></label>
                        <input type="text" id="expireYear" name="expireYear" required>
                    </div>

                    <div class="form-group">
                        <label for="ccv">CVV:<br></label>
                        <input type="text" id="ccv" name="ccv" required>
                    </div>

                    <button type="submit" id="submit-extrainfo">Buy</button>
                </form>
            </div>
        </div>
    </body>
</html>

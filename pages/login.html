<!DOCTYPE html>
<html lang="en">

    <head>
        <!-- Links to Styles sheet -->
        <link rel="stylesheet" href="../stylesheets/loginStyles.css">
        <link rel="stylesheet" href="../stylesheets/navbar.css">
        
        <title> Fess Up </title>
    </head>

    <body>
        <div class = "navbar">
            <ul>
                <li><a href="/pages/main.html">Fess Up</a></li>
                <li><a href="/pages/post.html">Create Post</a></li>
                <li><a href="/pages/login.html" class="active">Admin Login</a></li>
            </ul>
        </div>

        <h1> Admin Login </h1>

        <!-- LOGIN FORM IMPORTANT NEED SCRIPTS REALLY IMPORTANT-->
        <div class="login-container">
            <form action="/scripts/login.js" method="post">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit">Login</button>
            </form>
        </div>

    </body>

</html>

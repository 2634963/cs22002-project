<!-- Admin Login Page for fess up-->
<!DOCTYPE html>
<html lang="en">

    <head>
        <!-- Links to Styles sheet -->
        <link rel="stylesheet" href="/stylesheets/loginStyles.css">
        <link rel="stylesheet" href="/stylesheets/navbar.css">
        <script src="/scripts/login.js" defer></script>
        
        <title>FessUp</title>
    </head>

    <body>
        <div class = "navbar">
            <ul>
                <li><a href="/pages/main.html">Fess Up</a></li>
                <li><a href="/pages/post.html">Create Post</a></li>
                <li><a href="/pages/login.html" class="active">Admin Login</a></li>
            </ul>
        </div>

        <h1>Login</h1>

        <!-- LOGIN FORM IMPORTANT NEED SCRIPTS REALLY IMPORTANT -->
        <div class="login-container">
            <p id="error"></p>

            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <button type="submit" id="login">Login</button>
            </form>
        </div>

    </body>

    
</html>

<!-- Admin Login Page for fess up-->
<!DOCTYPE html>
<html lang="en">

    <head>
        <!-- Links to Styles sheet -->
        <link rel="stylesheet" href="/stylesheets/loginStyles.css">

        <script src="/scripts/login.js" defer></script>
        
        <title>FessUp</title>
    </head>

    <body>
        <span id="navbar"></span>
        <script src="/scripts/include.js" onload="includeHTML('/pages/navbar.html', 'navbar')"></script>

        <h1>Login</h1>

        <!-- LOGIN FORM IMPORTANT NEED SCRIPTS REALLY IMPORTANT -->
        <div class="login-container">
            <p id="error"></p>

            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <button type="submit" id="login">Login</button>
            </form>
        </div>

    </body>

    
</html>
